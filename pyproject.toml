[project]
name = "eye-q"
version = "0.1.0"
description = "Open-vocabulary VLM retrofit appliance for IP camera surveillance"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # ── Core ─────────────────────────────────
    "numpy>=1.24",
    # opencv-python (not -headless): demo.py needs cv2.imshow for the
    # visual Stage 1 runner. Installing both clobbers the same module.
    "opencv-python>=4.8",
    "pyzmq>=25.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # ── Inference ────────────────────────────
    "ultralytics>=8.2",
    "torch>=2.1",
    "torchvision>=0.16",
    # Capped below 4.50 for the vlm_backend='moondream' path, which pins
    # Moondream2's 2024-08-26 revision. The default moondream4bit backend's
    # 2025-04-14 remote code targets 4.44+ and is happy inside the same range.
    "transformers>=4.40,<4.50.0",
    "einops>=0.7",
    "accelerate>=0.25",
    "Pillow>=10.0",
    # ── API ──────────────────────────────────
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "websockets>=12.0",
    # ── Utilities ────────────────────────────
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# torchao is what keeps the moondream4bit weights 4-bit *at runtime*, and it
# only pays off on CUDA: the remote code's int4_weight_only() defaults to
# TensorCoreTiledLayout, which dispatches to torch._weight_int4pack_mm and
# exists on no other device. Off CUDA the backend stubs the import and
# dequantizes at load instead, so this is deliberately not a hard dependency.
#
# Pinned below 0.14, which removed the int4_weight_only name the remote code
# imports at module scope. Raising the cap means checking that name still
# resolves, not just that the package installs.
cuda = ["torchao>=0.11,<0.14"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
eyeq = "main:main"

[tool.ruff]
line-length = 100
target-version = "py313"
# Downloaded model weights ship their own vendored source; never our problem.
extend-exclude = ["models", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests that load real ML models (deselect with '-m \"not slow\"')",
]
