[project]
name = "eye-q"
version = "0.1.0"
description = "Open-vocabulary VLM retrofit appliance for IP camera surveillance"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # ── Core ─────────────────────────────────
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyzmq>=25.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # ── Inference ────────────────────────────
    "ultralytics>=8.2",
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "einops>=0.7",
    "accelerate>=0.25",
    "Pillow>=10.0",

    # ── API ──────────────────────────────────
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "websockets>=12.0",

    # ── Utilities ────────────────────────────
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
eyeq = "main:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests that load real ML models (deselect with '-m \"not slow\"')",
]
